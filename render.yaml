# THIS FILE HAS NEVER BEEN APPLIED. It is documentation, not the live config.
#
# Checked 2026-10-13: the Render account has NO Blueprint instance, and the one
# live service was created and is configured in the dashboard by hand. So
# nothing here is in force -- every value below describes what the deployment
# SHOULD hold, and the dashboard is the authority for what it DOES hold.
#
# Two consequences worth knowing before trusting a line of it:
#   * Applying it as a Blueprint would CREATE services, including the paid
#     worker below, rather than adopt the existing one.
#   * It said `varadhi-backend` until 2026-10-13, which is not the service's
#     name -- and a URL built from that name 404s. The live service is
#     `varadhi-project-tracker`.
#
# MIGRATIONS ARE NOT RUN BY THIS FILE. Read before deploying.
#
# Neither buildCommand nor startCommand migrates, and the API no longer migrates
# at boot (that path was removed when node-pg-migrate became the only migration
# system). So a deploy applies ZERO schema changes.
#
# The module pools also now require their schemas to exist — src/platform/db.js
# sets search_path to `<module>,extensions` with no `public` fallback. Deploying
# this service against a database that has not had the schema split applied will
# start, then fail every query, and /health/ready will report 0-of-7 schemas.
#
# Order is therefore: migrate the database first, verify, then deploy. See the
# deployment runbook at docs/PRODUCTION-DEPLOYMENT.md.
#
# TWO SERVICES, ONE CODEBASE
#
# `varadhi-project-tracker` serves HTTP and runs no sweeps (SERVICE_ROLE=web).
# `varadhi-cron` runs the sweeps and binds no port (SERVICE_ROLE=cron).
#
# Same repo, same build, same image — only SERVICE_ROLE differs. See the role
# block at the top of src/server.js. Why: a sweep that stalls on a slow query
# used to hold the event loop a request needed, and the web tier could not be
# scaled without relying on the advisory lock to suppress N-1 copies of every
# sweep. Now "the API is busy" and "a sweep is slow" are two problems with two
# restart buttons.
#
# THE CRON WORKER SHIPS PAUSED (ENABLE_CRON=false), on purpose. Turning the
# sweeps on is a deliberate step taken after a deploy is verified, and it is now
# a change to one service that cannot affect the API. Until it is flipped, no
# sweep runs anywhere — which is exactly what production does today.
#
# A Render `worker` is not on the free plan, and since no Blueprint is connected
# the worker below does not exist and will not appear on its own. Running the
# sweeps as their own process means creating a Background Worker in the
# dashboard by hand -- same repo, same build, `SERVICE_ROLE=cron` -- and paying
# for one more instance. Nothing needs it today: ENABLE_CRON is false and no
# sweep runs anywhere.
#
# TWO THINGS THIS FILE DOES NOT CONFIGURE, both deliberate:
#   RATE_LIMIT_STORE  unset means the in-memory store, which is correct for a
#                     single instance. Set it to `postgres` AFTER migration 0002
#                     has created identity.rate_limit_buckets — and before ever
#                     running a second instance, because the memory store with
#                     MULTI_INSTANCE=true refuses to boot by design.
#   DATABASE_URL      the `databases:` block below declares a Render-managed
#                     Postgres. Production actually runs on Supabase, so the
#                     live service overrides DATABASE_URL in the dashboard. If
#                     this blueprint is ever re-applied, confirm which database
#                     the value points at before deploying.
services:
  - type: web
    name: varadhi-project-tracker
    # `runtime` replaced the deprecated `env` key in Render's current schema.
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    # Liveness, deliberately not /health/ready. Readiness touches the database,
    # so health-checking it would make a database blip roll back a good deploy
    # (and would fail outright before the schema migration has run).
    healthCheckPath: /health
    envVars:
      # Serves HTTP, runs no sweeps. The cron worker below owns those.
      #
      # Unset would mean `all` (serve HTTP *and* sweep), which is what this
      # service did before the split and what a local `npm run dev` still does.
      # It is named here rather than left to the default so that reading this
      # file tells you which half of the system this service is.
      - key: SERVICE_ROLE
        value: web
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: varadhi-db
          property: connectionString
      # ─────────────────────────────────────────────────────────────────────
      # THE MOST DESTRUCTIVE LINE IN THIS FILE. `generateValue: true` mints a
      # NEW secret whenever it is applied, and the live service's secret was set
      # in the dashboard, so applying this file would replace it. That instantly
      # signs every existing session out, and invalidates every outstanding
      # notification action link and password-reset token.
      #
      # It used to be worse. Until ENCRYPTION_KEY and PII_ENCRYPTION_KEY were
      # both set explicitly (2026-10-13), an unset ENCRYPTION_KEY derived its key
      # from JWT_SECRET — so a rotation also made every stored calendar OAuth
      # token and Teams webhook URL undecryptable, silently, because
      # platform/crypto.js returns null on a bad key rather than throwing. Both
      # keys are now explicit, which is what cut that blast radius down to
      # sessions and tokens.
      #
      # Rotating it deliberately is still a planned operation, not an edit. See
      # docs/PRODUCTION-DEPLOYMENT.md §4 for the order.
      #
      # If the worker below is ever created by hand, give it the SAME value as
      # the web service: notification action tokens are signed with this, and a
      # worker signing them differently would mint links the API rejects.
      # ─────────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      # Must be the real deployed frontend origin: it is both a CORS allowed
      # origin (server.js) and the base for deep links in push/email payloads
      # (notification-engine.js APP_URL).
      - key: FRONTEND_URL
        value: https://varadhi-project-tracker.vercel.app
      # Web push. Without BOTH keys the push channel degrades to a silent
      # no-op, so a deploy that omits them ships with push quietly disabled.
      # Generate once with `npx web-push generate-vapid-keys`, then paste the
      # values into the Render dashboard — sync:false keeps them out of git.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@varadhi.local
      # Module 2 inline push actions. Optional — falls back to a value derived
      # from JWT_SECRET when unset.
      - key: NOTIFICATION_ACTION_TTL_HOURS
        value: "72"
      # One switch for every background sweep, including the Module 4 calendar
      # sync, the Module 5 Teams retry/digest jobs and the Module 9 work-status
      # and leave-notice sweeps. A second gate follows it in server.js: only the
      # instance holding the advisory lock runs them, so N instances do not send
      # N copies.
      #
      # NOTE: production currently runs with this set to "false" in the Render
      # dashboard, which overrides the value here. It was turned off before the
      # schema split, when the reminder sweep's cross-schema query could not run
      # at all; that query has since been rewritten through module interfaces.
      # Turning it back on is a deliberate step, taken after a deploy is
      # verified -- not part of one.
      #
      # INERT ON THIS SERVICE. With SERVICE_ROLE=web, server.js refuses to start
      # a sweep whatever this says — the role is checked before the switch. The
      # key is kept only because the history above is worth keeping.
      #
      # It is not a safety net: if this service were ever set back to
      # SERVICE_ROLE=all, this `true` is what would start the sweeps. The real
      # net remains production's dashboard override to false. The value that
      # actually decides anything lives on `varadhi-cron` below.
      - key: ENABLE_CRON
        value: "true"
      # ── Modules 4 & 5 ──────────────────────────────────────────────────────
      # Encrypts calendar OAuth tokens and Teams webhook URLs at rest. Optional
      # (falls back to a value derived from JWT_SECRET) but STRONGLY recommended
      # here: with the fallback, regenerating JWT_SECRET on a redeploy would
      # make every stored token undecryptable and force all users to reconnect.
      # sync:false keeps it out of git — set it in the Render dashboard.
      - key: ENCRYPTION_KEY
        sync: false
      # ── Module 9 ───────────────────────────────────────────────────────────
      # Encrypts employee Aadhaar numbers at rest. Deliberately NOT derivable
      # from JWT_SECRET (platform/crypto.js forPurpose({ allowDerived: false })):
      # a JWT rotation must never be able to make stored Aadhaar numbers
      # undecryptable. Without it the people module refuses to WRITE an Aadhaar
      # number and everything else works normally.
      # Set it once in the Render dashboard and never change it.
      - key: PII_ENCRYPTION_KEY
        sync: false
      # Public origin of THIS service. Required for OAuth: the redirect URI
      # registered with Google/Microsoft must match exactly, and deriving it
      # from the inbound request is wrong behind Render's proxy.
      - key: API_PUBLIC_URL
        value: https://varadhi-project-tracker.onrender.com
      # Calendar providers. WITHOUT these the module runs against a built-in
      # mock calendar rather than failing — real sync stays off until they are
      # set in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false

  # ───────────────────────────────────────────────────────────────────────────
  # The scheduled sweeps. No port, no routes, no public URL.
  #
  # EVERY SHARED SECRET IS INHERITED, NOT RE-DECLARED. A sweep is not a
  # read-only job: the calendar sync refreshes OAuth tokens and the Teams jobs
  # read webhook URLs, both of which are encrypted at rest with ENCRYPTION_KEY.
  # A worker holding a DIFFERENT key would not fail loudly — it would fail to
  # decrypt every stored token and report them as broken connections. So these
  # are pulled from the web service with fromService rather than set twice.
  #
  # If Render cannot resolve one of these (it refuses fromService against a
  # sync:false key on some plans), set it in THIS service's dashboard to the
  # byte-identical value the web service holds. Not a fresh one.
  - type: worker
    name: varadhi-cron
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    # No healthCheckPath: a worker takes no inbound traffic, so there is nothing
    # for Render to probe. Liveness is the process staying up, which server.js
    # guarantees even on standby — see keepWorkerAlive().
    envVars:
      - key: SERVICE_ROLE
        value: cron
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: varadhi-db
          property: connectionString
      # SHIPS PAUSED. Flip to true in this service's dashboard once the deploy
      # is verified. Doing it here instead would turn nine sweeps on as part of
      # a deploy, which is how a release becomes twenty unexpected emails.
      - key: ENABLE_CRON
        value: "false"
      # How often a standby worker asks for the advisory lock. Only matters with
      # more than one instance; the default is 60s.
      - key: CRON_LEADER_RETRY_MS
        value: "60000"
      - key: JWT_SECRET
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: JWT_SECRET
      # Deep links in the notifications these sweeps send.
      - key: FRONTEND_URL
        value: https://varadhi-project-tracker.vercel.app
      - key: API_PUBLIC_URL
        value: https://varadhi-project-tracker.onrender.com
      - key: NOTIFICATION_ACTION_TTL_HOURS
        value: "72"
      # Push. Same reasoning as the web service: without BOTH keys the channel
      # is a silent no-op, so a sweep would reach in-app and email but not push.
      - key: VAPID_PUBLIC_KEY
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: VAPID_PUBLIC_KEY
      - key: VAPID_PRIVATE_KEY
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: VAPID_PRIVATE_KEY
      - key: VAPID_SUBJECT
        value: mailto:support@varadhi.local
      # Calendar OAuth tokens and Teams webhook URLs at rest. The calendar sync
      # sweep cannot do its job without this matching the web service exactly.
      - key: ENCRYPTION_KEY
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: ENCRYPTION_KEY
      # Aadhaar at rest. No sweep writes one today, but the people module's jobs
      # load profiles, and a mismatched key here would read them as corrupt.
      - key: PII_ENCRYPTION_KEY
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: PII_ENCRYPTION_KEY
      # The calendar sweep refreshes provider tokens, so it needs the same
      # client credentials the web service uses to obtain them.
      - key: GOOGLE_CLIENT_ID
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: GOOGLE_CLIENT_SECRET
      - key: MS_CLIENT_ID
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: MS_CLIENT_ID
      - key: MS_CLIENT_SECRET
        fromService:
          name: varadhi-project-tracker
          type: web
          envVarKey: MS_CLIENT_SECRET

databases:
  - name: varadhi-db
    databaseName: varadhi_db
    user: varadhi_user
    plan: free
