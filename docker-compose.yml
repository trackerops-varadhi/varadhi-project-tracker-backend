# Local development stack. NOT a deployment artifact.
# -----------------------------------------------------------------------------
#   docker compose up --build
#   docker compose --profile multi up --build     # two backends + leader election
#
# WHAT THIS IS FOR
# Running the backend against a throwaway Postgres, and — with the `multi`
# profile — running TWO backend instances at once, which is the only way to
# exercise the advisory-lock leader election and the shared rate-limit store the
# way production would. Both were unfalsifiable before this file existed.
#
# NO SECRETS, NO PRODUCTION.
# Every value below is either a literal throwaway credential for the local
# container (`postgres`/`postgres` on a database that is deleted with the
# volume) or a `${VAR}` placeholder read from the developer's shell. The Supabase
# URL is never referenced. .env is excluded by .dockerignore and is not mounted.

name: varadhi-local

services:
  db:
    image: postgres:17-alpine
    environment:
      # Throwaway. This database exists inside the compose network, holds test
      # data, and dies with `docker compose down -v`.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: varadhi_local
    ports:
      # Host-bound explicitly to loopback: without 127.0.0.1 Docker publishes on
      # 0.0.0.0 and this database is reachable from the local network.
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The backend must not start before the database can answer, or boot
      # migrations race an unready server.
      test: ["CMD-SHELL", "pg_isready -U postgres -d varadhi_local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot. Runs to completion, then exits; both backends wait for it.
  #
  # WHY THIS EXISTS
  # The db service comes up EMPTY. Without this, the backend starts against a
  # database with no schemas: its boot migrations die on `relation "users" does
  # not exist`, /health/ready returns 503 for 0-of-7 schemas, and every module
  # query fails — while /health still returns 200, because liveness touches
  # nothing. The stack looks up and is not.
  #
  # NODE_ENV=development is load-bearing, not boilerplate. The image bakes
  # NODE_ENV=production, and migrate-runner's makePool() turns SSL on for
  # production. This Postgres runs with ssl=off, so inheriting the image default
  # fails the handshake before a single statement runs.
  #
  # MIGRATE_ALLOW_CONTAINER_DB is the explicit half of the runner's
  # container-local guard: `db` having no dots is necessary but not sufficient,
  # because a DNS search domain could resolve a bare label to a real server.
  # Nothing but this file sets it.
  migrate:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/varadhi_local
      MIGRATE_ALLOW_CONTAINER_DB: "true"
      LOG_FORMAT: json
    command: ["npm", "run", "migrate"]
    # A one-shot job must not be resurrected by the restart policy.
    restart: "no"

  backend:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      # Not just "started" — the schemas must EXIST before the backend boots,
      # or it races the migration and loses.
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 5000
      LOG_FORMAT: json
      DATABASE_URL: postgresql://postgres:postgres@db:5432/varadhi_local
      # Cron stays OFF by default here exactly as it is everywhere else. Turn it
      # on deliberately when testing leader election.
      ENABLE_CRON: ${ENABLE_CRON:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      # Interpolated from the shell OR from backend/.env — compose reads that
      # file for ${VAR} substitution automatically. Nothing is baked into the
      # image (.dockerignore excludes .env), but the RUNNING container does
      # receive whatever .env holds, and `docker compose config` prints those
      # values in plaintext. Treat its output as sensitive.
      #
      # SUPABASE_URL IS NOT OPTIONAL, despite reading like it is.
      # platform/supabase.js calls createClient() at module load and throws
      # "supabaseUrl is required." when it is unset — the process then exits
      # before serving anything. So a machine with no .env and no exported
      # SUPABASE_URL cannot run this stack at all. That is a wart in
      # supabase.js (an eagerly-constructed client with no guard), recorded
      # here rather than worked around.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-not-a-real-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:5000:5000"

  # Second instance. Same image, same database, same advisory lock — so exactly
  # one of the two wins leadership and the other reports standby. Start it with
  # `--profile multi`.
  backend-2:
    profiles: ["multi"]
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      # Doubly required here: this instance runs RATE_LIMIT_STORE=postgres, and
      # without identity.rate_limit_buckets (migration 0002) the store's startup
      # verify throws and the process exits 1 before serving anything.
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 5000
      LOG_FORMAT: json
      DATABASE_URL: postgresql://postgres:postgres@db:5432/varadhi_local
      ENABLE_CRON: ${ENABLE_CRON:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # Two instances sharing memory-backed counters would each enforce the full
      # quota. The store refuses that combination at startup rather than
      # silently allowing 2x the limit — which is the point of this profile.
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
      MULTI_INSTANCE: "true"
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-not-a-real-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Required, not optional — see the note on the backend service. Omitting
      # these is what made this instance exit at startup with
      # "supabaseUrl is required." while `backend` came up fine, because only
      # `backend` had them.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:5001:5000"

volumes:
  db-data:
