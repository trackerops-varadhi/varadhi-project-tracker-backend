# Keep the production API out of hibernation during working hours
# -----------------------------------------------------------------------------
# WHAT HAPPENED, AND WHY THIS FILE EXISTS
#
# 2026-10-14: nobody in the office could sign in. The login form reported
# "Invalid email or password" for every correct credential. The real answer was
# in the response headers, not the body:
#
#   HTTP/1.1 429 Too Many Requests
#   X-Render-Routing: hibernate-rate-limited
#   Server: Vercel            <- the same-origin proxy, just relaying it
#
# That 429 is RENDER'S, not this application's. A free-tier Render instance
# spins down after ~15 minutes of inactivity, and Render's router sheds a burst
# of requests aimed at a sleeping instance rather than queueing them all. The
# request never reached Express, so neither the login limiter in
# src/modules/identity/auth.routes.js nor the password check ever ran -- and
# /api/auth/me, which this application does not rate limit at all, returned 429
# too, which is the tell.
#
# Diagnosis to repeat if it recurs: `curl -D - .../api/auth/me` against the
# Render URL directly. `x-render-routing: hibernate-rate-limited` means
# hibernation; an envelope body (`{"success":false,...}`) means it really is us.
#
# WHAT THIS DOES
# Pings /health often enough that the instance never goes idle long enough to
# hibernate, so there is no cold burst for Render to shed.
#
# WHAT THIS IS NOT
# It is not the real fix, and it should not be mistaken for one. The real fix is
# an instance type that does not hibernate (Render Starter), which also removes
# the free tier's 750 instance-hours/month ceiling. Two honest limitations here:
#
#   * GitHub's scheduled runs are best-effort. A busy window can delay a run by
#     10+ minutes, which is long enough for the instance to sleep anyway.
#   * GitHub disables scheduled workflows in a repository with no commits for
#     60 days. The sweeps would stop silently.
#
# An external uptime monitor (cron-job.org, UptimeRobot, Better Stack) is more
# reliable than this for the same cost, and it also alerts when the API is down.
#
# WHY WORKING HOURS ONLY, NOT 24/7
# A free web service has 750 instance-hours per month across the workspace, and
# 24/7 is ~744 -- no headroom for a second service or a rebuild. This window is
# 02:00-15:59 UTC = 07:30-21:29 IST, Monday to Saturday: roughly 364 hours a
# month, which leaves the rest of the budget intact. Outside it the first
# request of the day still wakes the instance, and the frontend now retries
# through that (varadhi-tracker/src/lib/api-client.js) instead of showing a
# password error.
#
# AFTER THE RENDER STARTER UPGRADE, SLACKEN THE SCHEDULE
# A Starter instance does not hibernate, so the 10-minute cadence stops being
# about warmth and becomes a readiness canary. Change the cron to `*/30 2-15 * * 1-6`
# at that point. The reason is cost, not tidiness: on a PRIVATE repository
# scheduled runs bill against the 2,000 free Actions minutes/month, and every-10
# minutes is ~84 runs a day (~2,200 min/month) -- over the cap. Every 30 minutes
# is ~730. Public repositories get unmetered Actions minutes and can leave it.
#
# NO SECRETS. /health is public, returns no data about anyone, and the URL is
# already public. Override it with a repository variable BACKEND_URL if the
# service is ever renamed.

name: keep-warm

on:
  schedule:
    - cron: "*/10 2-15 * * 1-6"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://varadhi-project-tracker.onrender.com' }}
        run: |
          set -uo pipefail
          # --max-time 90: a cold start on the free tier can take ~60s, and the
          # whole point is to be the request that absorbs that wait instead of a
          # user. --retry 3 with a delay covers the hibernate throttle itself,
          # which clears once the container is actually up.
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
                   --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
                   "$BACKEND_URL/health")
          echo "GET $BACKEND_URL/health -> $code"
          cat /tmp/health.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::health check returned $code"
          fi

      # Readiness is the one that would catch a real production problem: it
      # proves the database answers and that all module schemas and pools
      # resolved. A warm instance serving /health while /health/ready reports
      # 0-of-N schemas is the exact failure mode the schema split introduced.
      - name: Check /health/ready
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://varadhi-project-tracker.onrender.com' }}
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
                   "$BACKEND_URL/health/ready")
          echo "GET $BACKEND_URL/health/ready -> $code"
          cat /tmp/ready.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::readiness failed with $code -- the API is up but not serving"
            exit 1
          fi
