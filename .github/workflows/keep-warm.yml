# Keep the production API out of hibernation during working hours
# -----------------------------------------------------------------------------
# WHAT HAPPENED, AND WHY THIS FILE EXISTS
#
# 2026-10-14: nobody in the office could sign in. The login form reported
# "Invalid email or password" for every correct credential. The real answer was
# in the response headers, not the body:
#
#   HTTP/1.1 429 Too Many Requests
#   X-Render-Routing: hibernate-rate-limited
#   Server: Vercel            <- the same-origin proxy, just relaying it
#
# That 429 is RENDER'S, not this application's. A free-tier Render instance
# spins down after ~15 minutes of inactivity, and Render's router sheds a burst
# of requests aimed at a sleeping instance rather than queueing them all. The
# request never reached Express, so neither the login limiter in
# src/modules/identity/auth.routes.js nor the password check ever ran -- and
# /api/auth/me, which this application does not rate limit at all, returned 429
# too, which is the tell.
#
# Diagnosis to repeat if it recurs: `curl -D - .../api/auth/me` against the
# Render URL directly. `x-render-routing: hibernate-rate-limited` means
# hibernation; an envelope body (`{"success":false,...}`) means it really is us.
#
# WHAT THIS DOES
# Pings /health often enough that the instance never sits idle for the ~15
# minutes it takes to hibernate, so there is no cold burst for Render to shed.
#
# THE DEPLOYMENT IS STAYING ON THE FREE TIER (decided 2026-10-14), so this is
# the primary defence rather than a stopgap, and it is built accordingly:
#
#   * COVERAGE, NOT A SINGLE PING. GitHub's scheduled runs are best-effort and
#     can start 10+ minutes late -- longer than the idle window this exists to
#     stay inside, which would let the instance sleep between two "successful"
#     runs. So each run pings every 3 minutes for ~9 minutes. A late run then
#     still covers the gap it was late for, and three consecutive misses are
#     needed to lose warmth rather than one.
#   * OFF-PEAK MINUTES. The schedule fires at :04/:14/... rather than :00,
#     because the top of the hour is when most of GitHub's cron load queues.
#   * SERIALISED, NOT CANCELLED. `cancel-in-progress: false` means a tick that
#     arrives while the previous run is still pinging waits its turn instead of
#     killing it, which is what makes the coverage continuous.
#
# Actions minutes: this repository is PUBLIC, and public repositories get
# unmetered Actions minutes -- the long-running job below is free. If it is ever
# made private, scheduled runs start billing against the 2,000 free
# minutes/month and this needs cutting back to one short ping per run.
#
# WHY WORKING HOURS ONLY, NOT 24/7
# A free web service has 750 instance-hours per month across the workspace, and
# 24/7 is ~744 -- no headroom, and running out suspends the service mid-month.
# This window is 02:00-15:59 UTC = 07:30-21:29 IST, Monday to Saturday: roughly
# 364 hours, which leaves the rest of the budget intact. Outside it the first
# request of the day still wakes the instance, and the frontend now rides that
# out instead of reporting a wrong password (varadhi-tracker/src/lib/api-error.js,
# api-client.js, session-recovery.js) while telling the user the server is
# waking rather than leaving them on a silent spinner.
#
# ONE REMAINING WEAKNESS, WORTH KNOWING: GitHub disables scheduled workflows in
# a repository with no commits for 60 days, with an email warning first. If
# work on this repo ever pauses for two months, re-enable it from the Actions
# tab (or run it once with workflow_dispatch). An external uptime monitor
# (cron-job.org, UptimeRobot -- both free) has no such rule and alerts when the
# API is actually down, so it is the better primary if anyone is willing to own
# one more account.
#
# NO SECRETS. /health is public, returns no data about anyone, and the URL is
# already public. Override it with a repository variable BACKEND_URL if the
# service is ever renamed.

# ⚠ A SCHEDULE ONLY FIRES FROM THE DEFAULT BRANCH.
#
# GitHub runs `schedule` from the workflow file on the repository's DEFAULT
# branch and nowhere else. This repository's default is `main`, while the live
# code (and this file) is on `refactor/phase1-module-boundaries` -- the branch
# Render deploys. So as committed here, this workflow NEVER fires on its own:
# it shows up in the Actions tab, workflow_dispatch works, and the schedule is
# silently ignored. There is no warning for this.
#
# Three ways to make it real, in increasing order of what they touch:
#   1. Point the repository's default branch at the deployed branch
#      (Settings -> Branches). Changes nothing about the code or the deploy;
#      it only decides which branch GitHub reads schedules from, and arguably
#      matches reality, since this is the branch that runs in production.
#   2. Put THIS FILE on `main` as a file-only commit. Safe only while Render
#      deploys the refactor branch -- Render's branch setting is the thing to
#      check first, because a `main` deploy would ship the pre-split backend.
#   3. Skip GitHub for this and use an external monitor (cron-job.org,
#      UptimeRobot -- free). No default-branch rule, and it alerts on real
#      downtime. Then this file stays as a manual readiness check.
#
name: keep-warm

on:
  schedule:
    - cron: "4,14,24,34,44,54 2-15 * * 1-6"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Comfortably longer than the ping loop, so a slow cold start cannot be
    # mistaken for a hung job.
    timeout-minutes: 15

    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://varadhi-project-tracker.onrender.com' }}

    steps:
      # Readiness first: it is the check that would catch a real production
      # problem. It proves the database answers and that every module schema
      # and pool resolved -- a warm instance serving /health while
      # /health/ready reports 0-of-N schemas is the exact failure mode the
      # schema split introduced.
      #
      # --max-time 120: on the free tier this request may be the one absorbing
      # a cold start, which is the whole point -- better here than at a desk.
      # --retry with --retry-all-errors covers the hibernate throttle itself,
      # which clears as soon as the container is actually up.
      - name: Readiness
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
                   --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
                   "$BACKEND_URL/health/ready")
          echo "GET /health/ready -> $code"
          cat /tmp/ready.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::readiness failed with $code -- the API is reachable but not serving"
            exit 1
          fi

      # Spread across the gap to the next scheduled run, so a late or skipped
      # tick does not become an idle window. Cheap: curl, then sleep.
      - name: Hold it awake
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            sleep 180
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND_URL/health")
            echo "ping $i: GET /health -> $code"
            # A failure here is not worth failing the run: the next scheduled
            # run is minutes away, and a red cross on a keep-warm job trains
            # people to ignore the Actions tab. Readiness above is the step
            # that is allowed to shout.
            if [ "$code" != "200" ]; then
              echo "::warning::ping $i returned $code"
            fi
          done
